<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#05070b"/><stop offset=".55" stop-color="#0a1020"/><stop offset="1" stop-color="#071117"/></linearGradient>
 <linearGradient id="edge"><stop stop-color="#7c3aed"/><stop offset=".45" stop-color="#22d3ee"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#22d3ee" stop-opacity=".24"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
