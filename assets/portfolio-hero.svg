 <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#67e8f9" stroke-opacity=".055"/></pattern>
 <style>text{font-family:'Segoe UI',Arial,sans-serif}.m{font-family:Consolas,monospace}.scan{animation:s 6s linear infinite}.p{animation:p 2.3s ease-in-out infinite}.f{animation:f 4s ease-in-out infinite}.dash{stroke-dasharray:6 11;animation:d 7s linear infinite}@keyframes s{to{transform:translateX(1450px)}}@keyframes p{50%{opacity:.25}}@keyframes f{50%{transform:translateY(-7px)}}@keyframes d{to{stroke-dashoffset:-170}}</style>
</defs>
<rect width="1200" height="470" rx="30" fill="url(#bg)"/><rect width="1200" height="470" rx="30" fill="url(#grid)"/>
<circle cx="920" cy="190" r="280" fill="url(#glow)" filter="url(#blur)"/>
