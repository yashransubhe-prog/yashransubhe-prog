<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#05070d"/><stop offset=".52" stop-color="#0a1020"/><stop offset="1" stop-color="#07151c"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#8b5cf6"/><stop offset=".5" stop-color="#38bdf8"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#7c3aed" stop-opacity=".28"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#7dd3fc" stroke-opacity=".08"/></pattern>
 <style>
 text{font-family:'Segoe UI',Arial,sans-serif}.m{font-family:Consolas,'Courier New',monospace}
 .orb1{animation:o1 9s ease-in-out infinite alternate}.orb2{animation:o2 12s ease-in-out infinite alternate}
 .scan{animation:s 5.5s linear infinite}.pulse{animation:p 2.4s ease-in-out infinite}.dash{stroke-dasharray:7 12;animation:d 8s linear infinite}
 .float{animation:f 4s ease-in-out infinite}.blink{animation:b 1s steps(2) infinite}.line{animation:l 3.8s ease-in-out infinite}
 @keyframes o1{to{transform:translate(90px,30px)}}@keyframes o2{to{transform:translate(-70px,-25px)}}@keyframes s{to{transform:translateX(1450px)}}@keyframes p{50%{opacity:.25}}@keyframes d{to{stroke-dashoffset:-180}}@keyframes f{50%{transform:translateY(-7px)}}@keyframes b{50%{opacity:0}}@keyframes l{50%{opacity:.35}}
 </style>
</defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/><rect width="1200" height="420" rx="28" fill="url(#grid)"/>
<circle cx="180" cy="80" r="210" fill="url(#halo)" class="orb1"/><circle cx="1080" cy="340" r="240" fill="#0891b2" opacity=".06" filter="url(#blur)" class="orb2"/>
<g opacity=".8"><path d="M42 32H255" stroke="url(#neon)" stroke-width="2"/><circle cx="42" cy="32" r="4" fill="#a78bfa" class="pulse"/><text x="268" y="37" fill="#64748b" font-size="11" class="m">YR // DEVELOPER INTERFACE // 2026</text></g>
<g transform="translate(60 85)">
 <text y="35" fill="#94a3b8" font-size="13" class="m">HELLO, I BUILD SOFTWARE.</text>
 <text y="104" fill="#f8fafc" font-size="62" font-weight="800" letter-spacing="1">YASH RANSUBHE</text>
 <rect y="127" width="550" height="3" rx="2" fill="url(#neon)"/>
 <text y="171" fill="#cbd5e1" font-size="19">Computer Science • Full-Stack • Security • Cloud</text>
 <text y="208" fill="#718096" font-size="15">Turning curiosity into working systems.</text>
 <g transform="translate(0 245)">
  <rect width="150" height="39" rx="10" fill="#0e1625" stroke="#28354a"/><circle cx="19" cy="20" r="5" fill="#34d399" class="pulse"/><text x="33" y="25" fill="#dbeafe" font-size="11" class="m">AVAILABLE TO BUILD</text>
  <rect x="165" width="128" height="39" rx="10" fill="#0e1625" stroke="#28354a"/><text x="184" y="25" fill="#dbeafe" font-size="11" class="m">NSRIT • CSE</text>
  <rect x="308" width="134" height="39" rx="10" fill="#0e1625" stroke="#28354a"/><text x="327" y="25" fill="#dbeafe" font-size="11" class="m">INDIA • IST</text>
 </g>
</g>
<g transform="translate(740 60)" class="float">
 <rect width="390" height="294" rx="23" fill="#080d17" stroke="#29374c"/>
 <rect x="16" y="16" width="358" height="262" rx="15" fill="#0b1220" stroke="#1f2a3a"/>
 <circle cx="38" cy="38" r="5" fill="#fb7185"/><circle cx="56" cy="38" r="5" fill="#fbbf24"/><circle cx="74" cy="38" r="5" fill="#34d399"/>
 <text x="98" y="42" fill="#64748b" font-size="10" class="m">yash@dev — ~/workspace</text>
 <path d="M38 72H342M38 235H342" stroke="#1e293b"/>
 <text x="39" y="99" fill="#64748b" font-size="12" class="m">$ whoami</text><text x="39" y="124" fill="#67e8f9" font-size="13" class="m">student + product builder</text>
 <text x="39" y="158" fill="#64748b" font-size="12" class="m">$ focus --now</text><text x="39" y="183" fill="#c4b5fd" font-size="13" class="m">java / dsa / full-stack</text>
 <text x="39" y="207" fill="#86efac" font-size="13" class="m">security / cloud / systems</text>
 <text x="39" y="259" fill="#64748b" font-size="11" class="m">status: compiling next version</text><rect x="258" y="249" width="8" height="14" fill="#38bdf8" class="blink"/>
</g>
<path d="M670 48C706 91 691 139 723 173S687 267 730 329" fill="none" stroke="#38bdf8" stroke-opacity=".25" class="dash"/>
<g fill="#38bdf8" filter="url(#glow)"><circle cx="688" cy="88" r="3" class="line"/><circle cx="713" cy="167" r="3" class="line"/><circle cx="707" cy="284" r="3" class="line"/></g>
<rect x="-230" y="0" width="110" height="420" fill="#fff" opacity=".035" transform="skewX(-20)" class="scan"/>
</svg>