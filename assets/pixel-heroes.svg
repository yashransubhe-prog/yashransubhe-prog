<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" shape-rendering="crispEdges">
<defs>
 <linearGradient id="bg" x2="1"><stop stop-color="#070A10"/><stop offset=".5" stop-color="#0B1220"/><stop offset="1" stop-color="#070A10"/></linearGradient>
 <style>
 .a{animation:f 3.2s ease-in-out infinite}.b{animation:f 3.2s .6s ease-in-out infinite}.c{animation:f 3.2s 1.2s ease-in-out infinite}.d{animation:f 3.2s 1.8s ease-in-out infinite}
 .blink{animation:p 1.7s steps(2) infinite}.code{animation:s 7s linear infinite}
 @keyframes f{50%{transform:translateY(-5px)}}@keyframes p{50%{opacity:.25}}@keyframes s{to{transform:translateX(90px)}}
 </style>
</defs>
<rect width="1200" height="260" rx="22" fill="url(#bg)"/>
<g opacity=".12" stroke="#38BDF8"><path d="M0 52H1200M0 104H1200M0 156H1200M0 208H1200"/><path d="M100 0V260M200 0V260M300 0V260M400 0V260M500 0V260M600 0V260M700 0V260M800 0V260M900 0V260M1000 0V260M1100 0V260"/></g>

