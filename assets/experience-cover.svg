<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#040509"/><stop offset=".48" stop-color="#080d18"/><stop offset="1" stop-color="#071018"/></linearGradient>
 <linearGradient id="neon"><stop stop-color="#7c3aed"/><stop offset=".45" stop-color="#22d3ee"/><stop offset=".72" stop-color="#f59e0b"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
 <radialGradient id="cyan"><stop stop-color="#22d3ee" stop-opacity=".25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
 <radialGradient id="red"><stop stop-color="#ef4444" stop-opacity=".14"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#67e8f9" stroke-opacity=".045"/></pattern>
 <style>
 text{font-family:'Segoe UI',Arial,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}
 .scan{animation:scan 7s linear infinite}.pulse{animation:pulse 2.6s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.float2{animation:float 6s 1s ease-in-out infinite}.dash{stroke-dasharray:7 13;animation:dash 8s linear infinite}.type{animation:blink 1s steps(2) infinite}.spark{animation:spark 3s ease-in-out infinite}
 @keyframes scan{to{transform:translateX(1650px)}}@keyframes pulse{50%{opacity:.25}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes dash{to{stroke-dashoffset:-200}}@keyframes blink{50%{opacity:0}}@keyframes spark{50%{opacity:.2;transform:scale(.7)}}
 </style>
</defs>
<rect width="1400" height="620" rx="34" fill="url(#bg)"/><rect width="1400" height="620" rx="34" fill="url(#grid)"/>
<circle cx="1080" cy="220" r="370" fill="url(#cyan)" filter="url(#blur)"/><circle cx="1230" cy="530" r="300" fill="url(#red)" filter="url(#blur)"/>
<!-- top chrome -->
<path d="M48 42H420" stroke="url(#neon)" stroke-width="2"/><circle cx="48" cy="42" r="5" fill="#22d3ee" class="pulse"/><text x="438" y="46" fill="#64748b" font-size="11" class="mono">YR / ENGINEERING PORTFOLIO / BUILD 26.10</text>
<g transform="translate(62 116)">
 <text fill="#67e8f9" font-size="13" class="mono">HELLO, WORLD — I'M</text>
 <text y="83" fill="#f8fafc" font-size="72" font-weight="800" letter-spacing="-2">YASH RANSUBHE</text>
 <rect y="105" width="575" height="3" rx="2" fill="url(#neon)"/>
 <text y="154" fill="#cbd5e1" font-size="21">Computer Science Engineer in the making.</text>
 <text y="190" fill="#94a3b8" font-size="16">Full-stack • Flutter • Security • Cloud • Core CS</text>
 <text y="242" fill="#64748b" font-size="14">I don't just collect technologies.</text>
 <text y="270" fill="#e2e8f0" font-size="14">I build with them until I understand the system.</text>
 <g transform="translate(0 322)">
  <rect width="166" height="42" rx="10" fill="#0c1421" stroke="#263449"/><circle cx="22" cy="21" r="5" fill="#34d399" class="pulse"/><text x="38" y="26" fill="#dbeafe" font-size="10" class="mono">BUILD MODE • ON</text>
  <rect x="180" width="136" height="42" rx="10" fill="#0c1421" stroke="#263449"/><text x="205" y="26" fill="#dbeafe" font-size="10" class="mono">NSRIT • CSE</text>
 </g>
</g>
<!-- cinematic workstation -->
<g transform="translate(770 82)" class="float">
 <path d="M18 405H555L590 447H-15Z" fill="#080b10" stroke="#1e293b"/>
 <rect x="35" y="35" width="475" height="285" rx="22" fill="#070a10" stroke="#334155"/>
 <rect x="55" y="55" width="435" height="245" rx="12" fill="#030609"/>
 <circle cx="74" cy="73" r="4" fill="#ef4444"/><circle cx="88" cy="73" r="4" fill="#f59e0b"/><circle cx="102" cy="73" r="4" fill="#22c55e"/>
 <text x="75" y="107" fill="#64748b" font-size="10" class="mono">~/yash/next</text>
 <text x="75" y="137" fill="#a78bfa" font-size="11" class="mono">const</text><text x="113" y="137" fill="#e2e8f0" font-size="11" class="mono">future =</text><text x="176" y="137" fill="#67e8f9" font-size="11" class="mono">build(idea)</text><text x="250" y="137" fill="#f8fafc" font-size="11" class="mono">;</text>
 <path d="M76 160H235M76 180H306M76 200H196M76 220H270M76 240H230" stroke="#263449" stroke-width="6"/>
 <path d="M340 145l38 29-38 29M393 203l31-59M440 145l38 29-38 29" fill="none" stroke="#22d3ee" stroke-width="4" class="dash"/>
 <rect x="210" y="320" width="126" height="14" rx="6" fill="#1e293b"/><rect x="244" y="334" width="58" height="44" fill="#111827"/>
 <!-- small side screen -->
 <g transform="translate(425 105) rotate(5)" class="float2"><rect width="155" height="112" rx="12" fill="#080d15" stroke="#312e81"/><path d="M22 78l26-30 24 18 28-38 31 21" fill="none" stroke="#8b5cf6" stroke-width="3"/><circle cx="100" cy="28" r="5" fill="#22d3ee" class="pulse"/></g>
</g>
<!-- seated developer -->
<g transform="translate(930 400)">
 <circle cx="92" cy="35" r="38" fill="#111827" stroke="#334155"/><path d="M45 91Q92 55 139 91L165 196H18Z" fill="#0c111b" stroke="#263449"/>
 <path d="M73 24Q92 5 111 24" fill="none" stroke="#475569" stroke-width="5"/>
 <circle cx="92" cy="118" r="15" fill="#071018" stroke="#22d3ee" stroke-width="2" filter="url(#glow)" class="pulse"/>
</g>
<!-- subtle superhero-inspired easter eggs, no labels -->
<g opacity=".72">
 <circle cx="1265" cy="88" r="28" fill="none" stroke="#38bdf8" stroke-width="2" class="pulse"/><circle cx="1265" cy="88" r="16" fill="none" stroke="#f8fafc"/><circle cx="1265" cy="88" r="6" fill="#67e8f9" filter="url(#glow)"/>
 <path d="M1165 505l10-24 10 24 24 10-24 10-10 24-10-24-24-10z" fill="none" stroke="#f59e0b" stroke-width="2" class="spark"/>
 <path d="M1290 462q22-35 44 0q-22 34-44 0zM1312 445v34" fill="none" stroke="#ef4444" stroke-width="2"/>
</g>
<rect x="-180" width="100" height="620" fill="#fff" opacity=".025" transform="skewX(-18)" class="scan"/>
</svg>